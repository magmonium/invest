name: CD

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  version-check:
    name: Check Version Change
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Check if version changed
        id: check
        run: |
          FILE="mag_assets/remote/invest.yml"
          BASE_SHA="$(git rev-parse HEAD~1)"
          CHANGED=$(git diff ${BASE_SHA} HEAD --name-only | grep -c "^${FILE}$" || true)
          if [ "$CHANGED" -gt "0" ]; then
            PREV=$(git show ${BASE_SHA}:${FILE} 2>/dev/null | grep '^version:' | awk '{print $2}' || echo "")
            CURR=$(grep '^version:' ${FILE} | awk '{print $2}')
            if [ "$PREV" != "$CURR" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "Version changed: $PREV → $CURR"
            else
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "Version unchanged: $CURR (nothing to deploy)"
            fi
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Manifest not modified (nothing to deploy)"
          fi

  deploy:
    name: Build & Deploy to Magmonium
    needs: version-check
    if: needs.version-check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --no-package-lock
      - name: Generate code and tests from .magmonium
        run: npm run gen:test
      - name: Build assets and web component
        run: npm run build:wc --ignore-scripts
        env:
          BUILD_CONFIG: prod
      - name: Package as bundle.zip
        run: cd dist/invest-wc && zip -r ../../bundle.zip .
      - name: Read app id and endpoint from the design source
        run: |
          APP_ID=$(jq -r '.appTarget.appId // empty' .magmonium/index.json)
          ENDPOINT=$(jq -r '.appTarget.environment.hosts.backendUrl // empty' .magmonium/index.json)
          ENDPOINT="${ENDPOINT%/}"
          ENDPOINT="${ENDPOINT%/swagger.json}"
          if [ -z "$APP_ID" ] || [ -z "$ENDPOINT" ]; then
            echo "::error::.magmonium/index.json names no appTarget.appId or Environment backendUrl. Link the app to its Store App in One UI and Push."
            exit 1
          fi
          case "$ENDPOINT" in
            *://localhost*|*://127.0.0.1*|*://0.0.0.0*)
              echo "::error::The Environment's Backend URL is $ENDPOINT, which a runner cannot reach. Pick dev or prod in One UI's Environment panel and Push."
              exit 1
              ;;
          esac
          echo "MAG_APP_ID=$APP_ID" >> "$GITHUB_ENV"
          echo "MAG_ENDPOINT=$ENDPOINT" >> "$GITHUB_ENV"
      - name: Upload bundle to backend
        run: |
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer ${{ secrets.MAG_DEPLOY_TOKEN }}" \
            -F "bundle=@bundle.zip" \
            "${MAG_ENDPOINT}/store/v1/bundle/${MAG_APP_ID}"
      - name: Trigger deployment
        run: |
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer ${{ secrets.MAG_DEPLOY_TOKEN }}" \
            "${MAG_ENDPOINT}/store/v1/deploy/${MAG_APP_ID}"
