de: Mit Liebe von Team **Magmonium** für Ihre indischen Aktien- und
  ETF-Abenteuer! Denken Sie daran, dass Märkte riskant sein können, und
  betrachten Sie diese App als Ihren Bildungsassistenten.
el: Δημιουργήθηκε με αγάπη από την ομάδα **Magmonium** για τις περιπέτειές σας
  με τα ινδικά μετοχές και ETF! Θυμηθείτε ότι οι αγορές μπορεί να είναι
  επικίνδυνες, οπότε θεωρήστε αυτή την εφαρμογή ως τον εκπαιδευτικό σας βοηθό.
eo: Kreita kun amo de la teamo **Magmonium** por viaj hinda akciaj kaj
  ETF-aventuroj! Memoru, ke merkatoj povas esti riskaj, do traktu ĉi tiun
  aplikaĵon kiel vian edukan flankon.
es: Creado con amor por el equipo **Magmonium** para tus aventuras en acciones y
  ETF de la India. Recuerda que los mercados pueden ser arriesgados, así que
  trata esta app como tu compañero educativo.
et: Loodud armastusega meeskonna **Magmonium** poolt teie India aktsiate ja ETF
  seikluste jaoks! Pidage meeles, et turud võivad olla riskantsed, seega
  käsitlege seda rakendust oma hariduslikuna abivahendina.
eu: Eginda maitasunez **Magmonium** taldeak, zure Indiako akzio eta ETF
  abenturetan! Gogoratu merkatuek arriskua izan dezaketela, beraz, tratatu
  aplikazio hau zure hezkuntzako laguntzaile gisa.
fa: با عشق توسط تیم **Magmonium** برای ماجراجویی‌های شما در سهام و ETFهای هندی
  ساخته شده است! به یاد داشته باشید که بازارها می‌توانند پرریسک باشند، بنابراین
  این برنامه را به عنوان یار آموزشی خود در نظر بگیرید.
fi: Luotu rakkaudella tiimin **Magmonium** toimesta intialaisiin osakkeisiin ja
  ETF:hin liittyviin seikkailuihin! Muista, että markkinat voivat olla
  riskialttiita, joten käytä tätä sovellusta koulutusavustajana.
fr: Créé avec amour par l'équipe **Magmonium** pour vos aventures en actions et
  ETF indiens ! N'oubliez pas que les marchés peuvent être risqués, alors
  considérez cette application comme votre compagnon éducatif.
fy: Mei leaf makke troch team **Magmonium** foar joere Indiaanske aksje- en
  ETF-aventueren! Fergeat net dat merkaten risikofol kinne wêze, saach dizze app
  as joere ûnderwiislike sidekick.
ga: Cruthaithe le grá ag an bhfoireann **Magmonium** do do chuid eitleán stoc
  agus ETF na hIndia! Cuimhnigh go bhféadfadh margaidh a bheith rioscaíoch, mar
  sin bain úsáid as an aip seo mar do chomhghuaire oideachais.
gd: Air a chruthachadh le gaol leis an sgioba **Magmonium** airson do dhomhainn
  stoc is ETF na h-India! Cuimhnich gun urrainn do mhargaidhean a bhith
  cunnartach, mar sin cleachd an aplacaid seo mar do chom-pàirtiche foghlaim.
gl: Creado con amor polo equipo **Magmonium** para as túas aventuras en accións
  e ETF da India! Recorda que os mercados poden ser ariscados, así que trata
  esta app como o teu compañeiro educativo.
gu: "**Magmonium** ટીમ દ્વારા પ્રેમથી બનાવવામાં આવ્યું, તમારા ભારતીય શેર અને ETF
  સંકેતો માટે! યાદ રાખો કે બજારો જોખમી હોઈ શકે છે, તેથી આ એપ્લિકેશનને તમારા
  શૈક્ષણિક સાથી તરીકે ધારો."
haw: Hanaʻina ʻia ka aloha e ka hui **Magmonium** no kāu mau huakaʻi papahana a
  me nā ETF ʻo India! E hoʻomanaʻo, hiki ke pilikia nā mākeke, no laila e
  hoʻohana i kēia app e like me kāu hoa aʻo.
hi: "**Magmonium** टीम ने आपके भारतीय स्टॉक और ETF सफ़र के लिए प्यार से बनाया
  है! याद रखें, बाज़ार जोखिम भरे हो सकते हैं, इसलिए इस ऐप को अपना शैक्षिक साथी
  मानें।"
hmn: Tsim los ntawv los ntawm cov neeg **Magmonium** rau koj lub sijhawm ntawm
  Indian stock thiab ETF! Nco ntsoov, cov yeeb yaj ntawv tuaj yeem muaj kev
  txhaum, yog li, siv app no raws li koj tus kws pab kawm.
hr: Izrađeno s ljubavlju od strane tima **Magmonium** za vaše indijske dionice i
  ETF avanture! Zapamtite, tržišta mogu biti rizična, pa tretirajte ovu
  aplikaciju kao svog edukativnog saveznika.
hu: Szeretettel készült a **Magmonium** csapattól az indiai részvény- és
  ETF-kalandjaidhoz! Ne feledd, a piacok kockázatosak lehetnek, ezért tekintsd
  ezt az alkalmazást a tanulásod segítőjének.
hy: "Ստեղծված սիրով **Magmonium** թիմի կողմից ձեր հնդկական բաժնետոմսերի և
  ETF-ների արկածների համար: Նկատի ունեք, շուկաները կարող են ռիսկային լինել,
  ուստի դիտարկեք այս հավելվածը որպես ձեր կրթական ընկեր:"
id: Dibuat dengan cinta oleh tim **Magmonium** untuk petualangan saham dan ETF
  India Anda! Ingat, pasar bisa berisiko, jadi anggap aplikasi ini sebagai teman
  edukasi Anda.
ig: E mere eme n'ahụhụ site na otu **Magmonium** maka ụzọ gị nke akwụkwọ akụba
  na ETF India! Cheta, ụlọ ahịa nwere ike ịbụ ihe ize ndụ, ya mere jiri ngwa a
  dị ka onye enyi gị nke ọmụmụ.
is: Hannað með ást af lið **Magmonium** fyrir indversku hlutafé og ETF
  áhugamálin þín! Munndu að markaðir geta verið hætulegir, þannig að skaltu nota
  þessa app sem menntunarfélaga þinn.
it: Creato con amore dal team **Magmonium** per le tue avventure in azioni e ETF
  indiani! Ricorda, i mercati possono essere rischiosi, quindi considera questa
  app come il tuo compagno educativo.
iw: נוצר באהבה על ידי צוות **Magmonium** להרפתקאות המניות וה-ETF ההודיות שלך!
  זכור, שווקים יכולים להיות מסוכנים, לכן טפל באפליקציה זו כבן לוויה חינוכי שלך.
ja: "**Magmonium**
  チームがインドの株式やETFの冒険のために愛情込めて作成しました。市場にはリスクがあるため、このアプリを教育の相棒としてご利用ください。"
jw: Digaweke kanthi tresna dening tim **Magmonium** kanggo petualangan saham lan
  ETF India sampeyan! Elinga, pasar bisa ana risiko, mula anggep aplikasi iki
  minangka kanca edukasi sampeyan.
ka: შექმნილია სიყვარულით **Magmonium** გუნდის მიერ თქვენი ინდური მსხვილი და ETF
  თავგადასავლებისთვის! გახსოვდეთ, რომ ბაზრები შეიძლება იყოს რისკიანი, ამიტომ
  განიხილეთ ეს აპი როგორც თქვენი საგანმანათლებლო თანამგზავრი.
kk: "**Magmonium** командасы сіздің Индия акциялары мен ETF-теріне арналған бұл
  қолданбаны махаббатпен жасады! Науқандар қауіпті болуы мүмкін, сондықтан бұл
  қолданбаны білім беру серігіңіз ретінде қарастырыңыз."
af: Gemaak met liefde deur die span **Magmonium** vir jou Indiese aandele- en
  ETF-avonture! Onthou, markte kan risikoregt wees, behandel hierdie app as jou
  opvoedkundige sidekick.
am: በፍቅር ተዘጋጅቷል በ **Magmonium** ቡድን ለእርስዎ የህንድ አካል እና ኢቲኤፍ ጉዞዎች! ይህን መተግበሪያ እንደ
  ትምህርት አገልግሎት ይጠቀሙ።
ar: صُنع بحب من قبل فريق **Magmonium** لمغامراتك في الأسهم والـ ETF الهندية!
  تذكر، قد تكون الأسواق محفوفة بالمخاطر، فاعتبر هذا التطبيق رفيقك التعليمي.
as: প্ৰেমৰে তৈয়াৰ কৰা হৈছে **Magmonium** টীমৰ দ্বাৰা আপোনাৰ ভাৰতীয় ষ্টক আৰু
  ETF অভিযানৰ বাবে! মনত ৰাখিব, বজাৰ বিপদজনক হ'ব পাৰে, সেয়ে এই এপটোক আপোনাৰ
  শিক্ষামূলক সহচৰ হিচাপে লওক।
az: Sevgi ilə hazırlanmışdır **Magmonium** komandası tərəfindən sizin Hindistan
  səhmləri və ETF macəralarınız üçün! Yadda saxlayın, bazarlar riskli ola bilər,
  buna görə bu tətbiqi təhsil köməkçiniz kimi qəbul edin.
be: Створана з любоўю камандай **Magmonium** для вашых індыйскіх акцыйных і ETF
  прыгод! Памятайце, рынкі могуць быць рызыкоўнымі, таму лічце гэта прыкладанне
  вашым адукацыйным суправаднікам.
bg: Създаден с любов от екипа **Magmonium** за вашите индийски акции и ETF
  приключения! Помнете, пазарата могат да бъдат рисковани, така че разглеждайте
  това приложение като ваш образователен спътник.
en: Crafted with love by team **Magmonium** for your Indian stock and ETF
  adventures! Remember, markets can be risky, so treat this app as your
  educational sidekick.
