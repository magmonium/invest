    <m-one-root></m-one-root>
    <script>
      (function () {
        if (window.parent === window) return;
        var SOURCE = 'm-one-ui-run';
        var HELLO_TIMEOUT = 2000;
        var host = '';
        var settle;
        var connected = new Promise(function (resolve) {
          settle = resolve;
        });
        setTimeout(function () {
          settle(false);
        }, HELLO_TIMEOUT);
        var pending = {};
        var seq = 0;
        addEventListener('message', function (ev) {
          if (ev.source !== window.parent) return;
          var data = ev.data;
          if (!data || data.source !== SOURCE) return;
          if (data.type === 'run:bridge-ready') {
            host = ev.origin;
            settle(true);
            return;
          }
          if (data.type !== 'run:fetch-result') return;
          var entry = pending[data.id];
          if (!entry) return;
          delete pending[data.id];
          if (data.error) {
            entry.reject(new TypeError(data.error));
            return;
          }
          var empty = data.status === 204 || data.status === 205 || data.status === 304;
          entry.resolve(
            new Response(empty ? null : data.body, {
              status: data.status,
              statusText: data.statusText,
              headers: data.headers,
            })
          );
        });
        var native = window.fetch.bind(window);
        var relay = function (request) {
          return request.text().then(function (body) {
            var headers = {};
            request.headers.forEach(function (value, key) {
              headers[key] = value;
            });
            var id = 'f' + ++seq;
            return new Promise(function (resolve, reject) {
              pending[id] = { resolve: resolve, reject: reject };
              window.parent.postMessage(
                {
                  source: SOURCE,
                  type: 'run:fetch',
                  id: id,
                  url: request.url,
                  method: request.method,
                  headers: headers,
                  body: body || null,
                },
                host
              );
            });
          });
        };
        window.fetch = function (input, init) {
          var request;
          var url;
          try {
            request = new Request(input, init);
            url = new URL(request.url);
          } catch (err) {
            return native(input, init);
          }
          if (url.origin === location.origin) return native(input, init);
          if (url.protocol !== 'http:' && url.protocol !== 'https:') {
            return native(input, init);
          }
          return connected.then(function (ok) {
            return ok ? relay(request) : native(request);
          });
        };
        window.parent.postMessage({ source: SOURCE, type: 'run:bridge-hello' }, '*');
      })();
    </script>
    <script>
      (function () {
        if (window.parent === window) return;
        var last = '';
        var post = function () {
          var path = location.pathname + location.search + location.hash;
          if (path === last) return;
          last = path;
          window.parent.postMessage({ source: 'm-one-ui-run', type: 'run:route', path: path }, '*');
        };
        ['pushState', 'replaceState'].forEach(function (name) {
          var fn = history[name];
          history[name] = function () {
            var out = fn.apply(this, arguments);
            post();
            return out;
          };
        });
        addEventListener('popstate', post);
        addEventListener('hashchange', post);
        post();
      })();
    </script>
